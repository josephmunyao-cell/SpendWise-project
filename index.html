<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Personal Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <h1>SpendWise</h1>
        <p>Smart Financial Tracking Made Simple</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>Budget & Expense Processor</h2>
            <p>Click the button below to start the interactive budget calculator.</p>
            <button id="start-btn" onclick="runSpendWise()">Start Budget Calculation</button>
        </section>

        <section class="card results-card">
            <h2>Calculated Summary</h2>
            <div id="output-display">
                <p><em>Press "Start Budget Calculation" or check your browser console (F12) to see results.</em></p>
            </div>
        </section>
    </main>

    <!-- Link to JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
